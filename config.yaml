# Sector filter: CPV prefixes (TED classification). 72 = IT services.
# Change this one line to follow another sector, e.g. ["45"] for construction.
cpv_prefixes: ["72"]
# Empty list = all countries (ISO 3166-1 alpha-3, as TED uses them).
countries: []
backfill_days: 60
db_path: data/tenders.sqlite
raw_dir: data/raw
site_dir: site
user_agent: "tender-radar/0.1 (+https://github.com/Jenoyrex/tender-radar)"
request_delay_seconds: 1.5
# Matcher: "tfidf" (character 3-5-gram TF-IDF, chosen by docs/evaluation.md) or "embeddings"
# (needs: pip install -e ".[embeddings]").
match_method: tfidf
# Backtest history (tender-radar history): award notices for this many days, and
# competition notices a further history_lead_days before that so awards can be linked
# back to their original notice. Local only; data/history.sqlite is not committed.
history_db: data/history.sqlite
history_days: 730
history_lead_days: 180
