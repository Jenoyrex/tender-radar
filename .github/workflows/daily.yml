name: daily
on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC, after TED's morning publication
  workflow_dispatch:
  workflow_call:   # signup.yml rebuilds the site after adding/removing a profile
permissions:
  contents: write   # commit data/open-tenders.csv
  pages: write
  id-token: write
  issues: read      # tender-radar feedback
concurrency: {group: daily, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}   # tip of main, so a profile committed moments ago is included
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      # SQLite DB and raw TED responses. If the cache is ever
      # evicted, `update` simply backfills 60 days again (~2 minutes).
      - uses: actions/cache@v6
        with:
          path: |
            data/tenders.sqlite
            data/raw
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: pip install -e .   # add [embeddings] + CPU torch if config.yaml sets match_method: embeddings
      - name: Fetch new notices from TED
        id: update
        continue-on-error: true   # still rebuild the site from what we have; fail at the end
        run: tender-radar update
      - name: Collect feedback issues
        continue-on-error: true   # never block the site on the GitHub API
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: tender-radar feedback
      - run: tender-radar build
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Commit dataset snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-tenders.csv data/feedback.csv
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git pull --rebase && git push
      - name: Fail the run if fetching failed (triggers GitHub's failure email)
        if: steps.update.outcome == 'failure'
        run: exit 1
