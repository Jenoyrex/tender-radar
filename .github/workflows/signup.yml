name: signup
# Self-serve sign-up / removal from the issue forms in .github/ISSUE_TEMPLATE.
# Each run processes EVERY open sign-up/removal issue, oldest first (`tender-radar issues`),
# so no request is lost when GitHub's concurrency group replaces a pending run, and the
# limits (README "Sign-up limits") see each previous sign-up. The schedule sweeps up anything missed.
# Issue text is untrusted: it only reaches Python through the GitHub API, never a ${{ }} in a shell line.
on:
  issues:
    types: [opened]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
concurrency: {group: profiles, cancel-in-progress: false}   # one run at a time: no racing profile commits
env:
  PYTHONUTF8: "1"   # UTF-8 for all text I/O, whatever the runner locale
jobs:
  handle:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'signup') || contains(github.event.issue.labels.*.name, 'remove-feed')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, issues: read}
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      any: ${{ steps.run.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - id: run
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          tender-radar issues --out result.json
          echo "changed=$(jq '[.[] | select(.action == "created" or .action == "removed")] | length > 0' result.json)" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' result.json)" >> "$GITHUB_OUTPUT"
      - name: Commit profile changes
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profiles
          git commit -m "Self-serve profiles: $(jq -r '[.[] | select(.action == "created" or .action == "removed") | "\(.action) \(.slug) (#\(.number))"] | join(", ")' result.json)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - uses: actions/upload-artifact@v5
        if: steps.run.outputs.any == 'true'
        with: {name: result, path: result.json}

  deploy:
    needs: handle
    if: needs.handle.outputs.changed == 'true'
    uses: ./.github/workflows/daily.yml
    permissions: {contents: write, pages: write, id-token: write, issues: read}

  reply:
    needs: [handle, deploy]
    if: always() && needs.handle.result == 'success' && needs.handle.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - uses: actions/download-artifact@v5
        with: {name: result}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYED: ${{ needs.deploy.result }}
        run: |
          for i in $(jq -r 'keys[]' result.json); do
            n=$(jq -r ".[$i].number" result.json)
            action=$(jq -r ".[$i].action" result.json)
            [ "$action" = ignored ] && continue
            jq -r ".[$i].comment" result.json > comment.md
            if [ "$action" != rejected ] && [ "$DEPLOYED" != success ]; then
              printf '\n\n(The site rebuild did not finish just now; your change will appear after the next daily run.)\n' >> comment.md
            fi
            gh issue comment "$n" --body-file comment.md
            if [ "$action" = rejected ]; then gh issue close "$n" --reason "not planned"; else gh issue close "$n" --reason completed; fi
          done
