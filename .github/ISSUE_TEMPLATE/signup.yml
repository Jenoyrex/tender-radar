name: Get my tender feed
description: Free daily page + RSS feed of open EU IT-services tenders ranked for your business.
title: "Get my tender feed"
labels: ["signup"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in **a company name or a description** (or both). A bot creates your page and RSS feed
        within a few minutes and replies here with the links, then closes this issue.

        **Everything you type here is public**, and becomes a public profile file. Do not include
        personal data (names of people, emails, phone numbers).
  - type: input
    attributes:
      label: Company name
      description: Optional. If your company has won EU (TED) IT contracts before, we build the profile from those wins.
      placeholder: Example Software GmbH
  - type: textarea
    attributes:
      label: What does your business do?
      description: Optional if you gave a company name. One to five sentences; the matcher compares these words with every tender. No links.
      placeholder: We build and maintain websites and web portals on open-source CMS for public bodies, with a focus on accessibility.
  - type: dropdown
    attributes:
      label: Countries
      description: Countries whose buyers you want tenders from. Leave empty for all of Europe.
      multiple: true
      options:
        - Austria (AUT)
        - Belgium (BEL)
        - Bulgaria (BGR)
        - Croatia (HRV)
        - Cyprus (CYP)
        - Czechia (CZE)
        - Denmark (DNK)
        - Estonia (EST)
        - Finland (FIN)
        - France (FRA)
        - Germany (DEU)
        - Greece (GRC)
        - Hungary (HUN)
        - Ireland (IRL)
        - Italy (ITA)
        - Latvia (LVA)
        - Lithuania (LTU)
        - Luxembourg (LUX)
        - Malta (MLT)
        - Netherlands (NLD)
        - Poland (POL)
        - Portugal (PRT)
        - Romania (ROU)
        - Slovakia (SVK)
        - Slovenia (SVN)
        - Spain (ESP)
        - Sweden (SWE)
        - Iceland (ISL)
        - Liechtenstein (LIE)
        - Norway (NOR)
        - Switzerland (CHE)
        - United Kingdom (GBR)
  - type: input
    attributes:
      label: Minimum contract value (EUR)
      description: Optional, whole euros. Tenders that publish no value are always kept.
      placeholder: "50000"
  - type: input
    attributes:
      label: Maximum contract value (EUR)
      placeholder: "1000000"
  - type: input
    attributes:
      label: Words to exclude
      description: Optional, comma-separated. Tenders containing any of them are hidden.
      placeholder: hardware, printers
