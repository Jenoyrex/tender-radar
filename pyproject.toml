[project]
name = "tender-radar"
version = "0.1.0"
description = "Rank open EU public tenders (TED) by fit for small businesses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
tender-radar = "tender_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130   # the code favours dense, readable one-liners over wrapped ones
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the formatter wraps code; what is left are HTML/CSS template strings.
# E731: small named lambdas are used deliberately for one-line helpers.
ignore = ["E501", "E731"]
# PLW1514: text I/O without encoding= (preview rule, opted into explicitly). It only sees
# calls on objects it can tell are Paths; tests/test_util.py checks every call site by AST.
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]
