[project]
name = "tender-radar"
version = "0.1.0"
description = "Rank open EU public tenders (TED) by fit for small businesses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
tender-radar = "tender_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
